name: Backend CI

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite with complete diagnostics
        shell: bash
        run: |
          set -o pipefail
          python manage.py test --verbosity 2 2>&1 | tee django-test-output.log

      - name: Upload Django test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-test-diagnostics
          path: backend/django-test-output.log
          if-no-files-found: warn
          retention-days: 7
