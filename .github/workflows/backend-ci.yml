name: Backend CI

on:
  push:
    branches:
      - main
      - develop/**
  pull_request:
    branches:
      - main
      - develop/**
      - fix/**

permissions:
  contents: read

jobs:
  django-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: |
          set -o pipefail
          python manage.py test --verbosity 2 2>&1 | tee django-test-output.log

      - name: Upload Django test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-test-output
          path: backend/django-test-output.log
          if-no-files-found: warn
          retention-days: 7
